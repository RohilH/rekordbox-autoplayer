[project]
name = "rekordbox-autoplayer"
version = "0.1.0"
description = "Plays rekordbox USB playlists in order with beat-matched crossfades"
requires-python = ">=3.12,<3.14"
dependencies = [
    "av>=12",
    "fastapi>=0.110",
    "kaitaistruct>=0.11",
    "numpy>=1.26",
    "pedalboard>=0.9.26",
    "scipy>=1.18.1",
    "sounddevice>=0.4.6",
    "uvicorn>=0.29",
    "websockets>=12",
]

[project.scripts]
autoplayer = "autoplayer.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoplayer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
